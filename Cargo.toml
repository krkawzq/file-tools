[package]
name = "file_tools_core"
version = "0.2.0"
edition = "2021"
description = "Native filesystem, SSH, command, and string core for file-tools"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]
path = "src/core-rs/lib.rs"

[dependencies]
libc = "0.2"
pyo3 = { version = "0.25" }
shell-words = "1.1"
tempfile = "3.20"

[features]
# Keep Rust unit tests linkable on every OS. Maturin explicitly enables the
# extension-module feature when it builds the Python wheel.
default = []
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
